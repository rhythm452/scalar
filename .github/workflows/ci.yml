name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_fly: ${{ steps.check.outputs.has_fly }}
    steps:
      - id: check
        run: |
          # Job-level `if:` can't reference the secrets context directly
          # (GitHub rejects the whole workflow file at parse time); a step's
          # env: can, so presence is computed here and exposed as an output
          # for deploy to key off instead.
          echo "has_fly=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --project backend
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: uv run --project backend mypy --config-file backend/pyproject.toml backend/app
      - run: uv run --project backend pytest backend/tests -q --cov=backend/app --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend exec tsc --noEmit
      - run: pnpm --dir frontend test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir e2e install
      - run: pnpm --dir e2e exec playwright install --with-deps chromium
      - run: uv sync --project backend
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: uv run --project backend pytest backend/tests -q
        env:
          DATABASE_URL: sqlite:///./test-ci.db
      - name: Run Playwright tests (if any exist)
        run: |
          if find e2e/tests -name '*.spec.ts' | grep -q .; then
            pnpm --dir e2e exec playwright test
          else
            echo "No Playwright specs yet (e2e/tests is still scaffolding, Phase 8) -- skipping the webServer-backed run rather than timing out waiting on a frontend with no pages."
          fi

  doctor:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --project backend
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: bash scripts/doctor.sh

  # Frontend has no deploy job: Vercel's own GitHub integration builds preview
  # deployments on every PR and production deployments on push to main directly,
  # with no GitHub Actions step required (docs/DECISIONS.md ADR-020).
  deploy:
    runs-on: ubuntu-latest
    needs: [check-secrets, backend, frontend, e2e]
    if: ${{ github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has_fly == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
