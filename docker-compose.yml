services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      SEED_ON_BOOT: "true"
      SESSION_COOKIE_NAME: r53_session
      SESSION_EXPIRE_HOURS: "24"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend via plain `next dev`. frontend/src/middleware.ts proxies /api/* to
  # API_ORIGIN the same way here as it does once deployed to Vercel, so this
  # already exercises the real single-origin proxy path (docs/DECISIONS.md ADR-020).
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      API_ORIGIN: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:ro

volumes:
  sqlite-data:
