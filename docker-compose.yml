services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CORS_ORIGINS: http://localhost:3000
      SEED_ON_BOOT: "true"
      SESSION_COOKIE_NAME: r53_session
      SESSION_EXPIRE_HOURS: "24"
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend via plain `next dev` for fast local iteration. Use `pnpm --dir frontend preview`
  # (wrangler dev) when testing the real Cloudflare Worker proxy path end-to-end.
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      API_ORIGIN: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:ro

volumes:
  sqlite-data:
