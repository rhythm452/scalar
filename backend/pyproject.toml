[project]
name = "route53-clone-backend"
version = "0.1.0"
description = "AWS Route 53 console clone — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "passlib>=1.7.4",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
bind = [
  "dnspython>=2.6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "factory-boy>=3.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# passlib ships no type stubs (upstream issue #89); typed at call sites below.
module = "passlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# SQLAlchemy's async ORM bridges to sync code via greenlet_spawn(); without
# this, coverage silently under-reports every line that runs inside that
# switch (which, for this codebase, is most of the service layer) with no
# warning that the number is wrong.
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
