app = "scalar-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/app.db"
  SESSION_COOKIE_NAME = "r53_session"
  SESSION_EXPIRE_HOURS = "24"
  SEED_ON_BOOT = "true"
  LOG_LEVEL = "info"
  COOKIE_SECURE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"
    protocol = "http"

[[mounts]]
  source = "r53_data"
  destination = "/data"
